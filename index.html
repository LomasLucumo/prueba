<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f8a5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Circuito turístico</title>
<script src="turf.min.js"></script>
</head>
<body>
<main>
  <header><h1><span id="title">Circuito Corto</span></h1><span class="mu" id="net"></span></header>
  <div class="card">
    <svg id="map" viewBox="0 0 360 280"></svg>
    <div id="far" hidden>
      <div class="big" id="farT"></div>
      <div class="mu far-sub" id="farS"></div>
    </div>
    <button id="view" class="btn-block" hidden>Ver circuito completo</button>
  </div>
  <div class="card">
    <div class="mu" id="src">Iniciando…</div>
    <div class="big" id="seg">—</div>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div id="det" class="mu"></div>
    <div id="vis" class="mu"></div>
    <div id="alert" class="warn"></div>
    <div id="info" class="stop-info"></div>
  </div>
  <div class="row">
    <button id="gps" class="p">📍 Activar GPS</button>
    <button id="reset">Reiniciar</button>
  </div>
  <details class="card"><summary class="mu">Prueba</summary>
    <input type="range" id="sl" class="sim-range" min="0" max="1000" value="0" aria-label="Posición simulada">
  </details>
  <div class="mu" id="sw"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
